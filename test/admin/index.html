<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-TECH — Administration</title>
<style>
:root{color-scheme:dark;--bg:#060a14;--card:#10182c;--line:#263653;--text:#e6f1ff;--muted:#8aa0c0;--cyan:#22d3ee;--violet:#a78bfa;--green:#34d399;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 90% 0%,#39276a66,transparent 60%),var(--bg);color:var(--text);font:15px system-ui,Segoe UI,sans-serif}main{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:23px;margin:0;background:linear-gradient(90deg,var(--cyan),var(--violet));color:transparent;background-clip:text}h2{font-size:18px;margin:0 0 14px}.muted{color:var(--muted)}.card{background:#10182cdd;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 10px 30px #0004}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric strong{display:block;font-size:26px;margin-top:8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab,button{border:1px solid var(--line);background:#15223b;color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}.tab.active,button.primary{background:linear-gradient(120deg,#0891b2,#6d28d9);border:0}button.danger{color:#fecdd3}input,select,textarea{width:100%;background:#080f1e;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase} .scroll{overflow:auto}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#22314c;color:#c8d8f0;font-size:12px}.hidden{display:none!important}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:#17243b;color:#cde7ff;margin:12px 0}.error{color:#fda4af}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.small{font-size:12px}.login{max-width:420px;margin:8vh auto}.inline{display:flex;gap:8px}.inline>*{flex:1}@media(max-width:750px){main{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.formgrid{grid-template-columns:1fr}.card{padding:14px}}
</style></head><body><main>
<header><div><h1>E-TECH / ADMIN</h1><div class="muted small">Gestion privée de la boutique</div></div><button id="logout" class="hidden">Déconnexion</button></header>
<section id="login" class="card login"><h2>Connexion administrateur</h2><p class="muted">Connectez-vous avec le compte créé dans Supabase Auth et autorisé dans admin_users.</p><label>Email</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="primary" style="width:100%;margin-top:14px">Se connecter</button><div id="loginMsg" class="notice hidden"></div></section>
<section id="app" class="hidden">
<div class="grid" id="metrics"></div>
<nav class="tabs"><button class="tab active" data-tab="orders">Commandes</button><button class="tab" data-tab="customers">Clients</button><button class="tab" data-tab="products">Produits</button><button class="tab" data-tab="apps">Applications vendues</button><button class="tab" data-tab="subs">Abonnements</button><button class="tab" data-tab="stats">Statistiques</button></nav>
<div id="view"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=(n,c='DA')=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(Number(n||0))+' '+c;
let db,orders=[],customers=[],products=[],subs=[],apps=[],tab='orders';
function msg(t,el=$('#loginMsg')){el.textContent=t;el.classList.remove('hidden')}
function date(v){return v?new Date(v).toLocaleString('fr-FR'):'—'}
async function init(){
  if(!window.supabase){msg('La bibliothèque Supabase ne s’est pas chargée. Actualisez la page ou vérifiez votre connexion.');return}
  if(!window.SUPABASE_CONFIG||!SUPABASE_CONFIG.url||!SUPABASE_CONFIG.url.includes('supabase.co')||!SUPABASE_CONFIG.anonKey||SUPABASE_CONFIG.anonKey.startsWith('VOTRE')){
    msg('Configuration Supabase manquante ou incorrecte. Vérifiez test/supabase-config.js.');return
  }
  db=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.anonKey);
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(data.session)await enter();
  db.auth.onAuthStateChange((_e,s)=>{if(s)enter().catch(e=>msg('Erreur ouverture administration : '+e.message));else showLogin()});
}
function showLogin(){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');$('#logout').classList.add('hidden')}
async function enter(){const {data:{user}}=await db.auth.getUser();if(!user)return showLogin();const {data:admin,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!admin){await db.auth.signOut();msg('Ce compte ne possède pas les droits administrateur. Ajoutez son identifiant dans admin_users via SQL.');return}
$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await load();render()}
async function load(){const [o,c,p,s,a]=await Promise.all([db.from('orders').select('*').order('created_at',{ascending:false}),db.from('customers').select('*').order('created_at',{ascending:false}),db.from('products').select('*').order('created_at',{ascending:false}),db.from('subscriptions').select('*').order('expiry_date',{ascending:true}),db.from('apps').select('*').order('created_at',{ascending:true})]);for(const [r,n] of [[o,'commandes'],[c,'clients'],[p,'produits'],[s,'abonnements'],[a,'applications']])if(r.error)throw Error('Lecture '+n+' : '+r.error.message);orders=o.data;customers=c.data;products=p.data;subs=s.data;apps=a.data}
function metrics(){const revenue=orders.filter(x=>x.payment_status==='paid').reduce((a,x)=>a+Number(x.total),0);$('#metrics').innerHTML=[['Commandes',orders.length],['À traiter',orders.filter(x=>x.status==='pending').length],['Clients',customers.length],['Paiements reçus',money(revenue)]].map(([a,b])=>'<div class="card metric"><span class="muted">'+a+'</span><strong>'+b+'</strong></div>').join('')}
function table(headers,rows){return '<div class="scroll"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function orderView(){
  return `<div class="card"><div class="row"><h2>Commandes</h2><button onclick="loadAndRender()">Actualiser</button></div>
  ${table(['N° / Date','Client','Articles','Total','Validation','Paiement'],orders.map(o=>`<tr>
    <td><b>${esc(o.order_number||o.id.slice(0,8))}</b><br><span class="small muted">${date(o.created_at)}</span></td>
    <td>${esc(o.customer_name)}<br>${esc(o.customer_phone)}</td>
    <td>${esc(JSON.stringify(o.items))}</td><td>${money(o.total,o.currency)}</td>
    <td><b>${esc(({pending:'En attente',confirmed:'Validée',processing:'En préparation',shipped:'Expédiée',completed:'Terminée',cancelled:'Annulée'})[o.status]||o.status)}</b><br>
    <button class="primary" ${o.status==='confirmed'?'disabled':''} onclick="updateOrder('${o.id}','status','confirmed')">${o.status==='confirmed'?'Commande validée':'Valider la commande'}</button><br>
    <select onchange="updateOrder('${o.id}','status',this.value)">${opts(['pending','confirmed','processing','shipped','completed','cancelled'],o.status)}</select></td>
    <td><select onchange="updateOrder('${o.id}','payment_status',this.value)">${opts(['unpaid','proof_received','paid','refunded'],o.payment_status)}</select><br><span class="small muted">${esc(o.payment_method||'')}</span></td>
  </tr>`).join(''))}</div>`
}
function opts(a,v){return a.map(x=>'<option '+(x===v?'selected':'')+' value="'+x+'">'+x+'</option>').join('')}
function customerView(){return '<div class="card"><h2>Ajouter un client manuellement</h2><div class="formgrid"><div><label>Nom complet</label><input id="newCustomerName" placeholder="Nom du client"></div><div><label>Téléphone avec indicatif</label><input id="newCustomerPhone" placeholder="+213555123456"></div></div><button class="primary" style="margin-top:12px" onclick="addCustomer()">Ajouter le client</button><p class="muted small">Le numéro doit être unique et inclure l’indicatif du pays, par exemple +213…</p></div><div class="card"><h2>Clients enregistrés — '+customers.length+'</h2>'+table(['Client','Téléphone','Inscription','Commandes','Total payé','Actions'],customers.map(c=>{const os=orders.filter(o=>o.customer_phone===c.phone);return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+date(c.created_at)+'</td><td>'+os.length+'<br><span class="small muted">'+os.map(o=>esc(o.order_number||o.id.slice(0,8))).join(', ')+'</span></td><td>'+money(os.filter(o=>o.payment_status==='paid').reduce((a,o)=>a+Number(o.total),0))+'</td><td><div class="actions"><button onclick="editCustomer(\''+c.id+'\')">Modifier</button><button class="danger" onclick="deleteCustomer(\''+c.id+'\')">Supprimer</button></div></td></tr>'}).join(''))+'</div>'}
async function addCustomer(){const name=$('#newCustomerName').value.trim(),phone=$('#newCustomerPhone').value.trim().replace(/[\\s().-]/g,'');if(!name||!/^\\+?[0-9]{7,16}$/.test(phone))return alert('Saisissez un nom et un numéro valide avec indicatif.');const {error}=await db.from('customers').insert({name,phone});if(error)alert('Ajout impossible : '+(error.code==='23505'?'Ce numéro existe déjà.':error.message));else await loadAndRender()}
async function editCustomer(id){const c=customers.find(x=>x.id===id);if(!c)return;const name=prompt('Nom du client :',c.name);if(name===null)return;if(!name.trim())return alert('Le nom est obligatoire.');const phone=prompt('Téléphone avec indicatif :',c.phone);if(phone===null)return;const clean=phone.trim().replace(/[\\s().-]/g,'');if(!/^\\+?[0-9]{7,16}$/.test(clean))return alert('Numéro invalide.');const {error}=await db.from('customers').update({name:name.trim(),phone:clean}).eq('id',id);if(error)alert('Modification impossible : '+error.message);else await loadAndRender()}
async function deleteCustomer(id){const c=customers.find(x=>x.id===id);if(!c||!confirm('Supprimer le client « '+c.name+' » ? Les commandes associées conserveront leur historique.'))return;const {error}=await db.from('customers').delete().eq('id',id);if(error)alert('Suppression impossible : '+error.message);else await loadAndRender()}
function productView(){return '<div class="card"><h2>Ajouter un produit</h2><div class="formgrid"><div><label>Nom</label><input id="pn" placeholder="Nom du produit"></div><div><label>Prix</label><input id="pp" type="number" min="0" step=".01"></div><div><label>Devise</label><input id="pc" value="DA"></div><div><label>Description</label><input id="pd"></div></div><button class="primary" style="margin-top:12px" onclick="addProduct()">Ajouter le produit</button></div><div class="card"><h2>Catalogue — '+products.length+' produit(s)</h2>'+table(['Produit','Prix','Visibilité','Actions'],products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><span class="muted small">'+esc(p.description)+'</span></td><td>'+money(p.price,p.currency)+'</td><td>'+(p.active?'Actif':'Masqué')+'</td><td><div class="actions"><button onclick="editProduct(\''+p.id+'\')">Modifier</button><button onclick="toggleProduct(\''+p.id+'\','+(!p.active)+')">'+(p.active?'Masquer':'Activer')+'</button><button class="danger" onclick="deleteProduct(\''+p.id+'\')">Supprimer</button></div></td></tr>').join(''))+'</div>'}
function subsView(){return '<div class="card"><h2>Abonnements — '+subs.length+' suivi(s)</h2>'+table(['Service','Client','Début','Expiration','Statut','Actions'],subs.map(s=>'<tr><td><b>'+esc(s.service_name)+'</b></td><td>'+esc(customers.find(c=>c.id===s.customer_id)?.name||'—')+'</td><td>'+esc(s.start_date||'—')+'</td><td>'+esc(s.expiry_date||'—')+'</td><td><select onchange="updateSub(\''+s.id+'\',this.value)">'+opts(['active','expired','suspended','cancelled'],s.status)+'</select></td><td><div class="actions"><button onclick="editSub(\''+s.id+'\')">Modifier</button><button class="danger" onclick="deleteSub(\''+s.id+'\')">Supprimer</button></div></td></tr>').join(''))+'</div>'}
function appsView(){return '<div class="card"><h2>Ajouter une application vendue</h2><div class="formgrid"><div><label>Nom</label><input id="an" placeholder="Ex. Iron Pro Max"></div><div><label>Icône (emoji)</label><input id="ae" value="📺"></div>'+[[1,'1 mois'],[3,'3 mois'],[6,'6 mois'],[12,'12 mois']].map(([n,l])=>'<div><label>Prix — '+l+'</label><input id="ap'+n+'" type="number" min="0" step="1" placeholder="Laisser vide si indisponible"></div>').join('')+'</div><button class="primary" style="margin-top:12px" onclick="addApp()">Ajouter l’application</button></div><div class="card"><h2>Applications — '+apps.length+'</h2>'+table(['Application','Durées / prix','Visibilité','Actions'],apps.map(a=>'<tr><td><b>'+esc(a.name)+'</b> '+esc(a.emoji)+'</td><td>'+esc(JSON.stringify(a.prices))+'</td><td>'+(a.active?'Active':'Masquée')+'</td><td><div class="actions"><button onclick="editApp(\''+a.id+'\')">Modifier</button><button onclick="toggleApp(\''+a.id+'\','+(!a.active)+')">'+(a.active?'Masquer':'Activer')+'</button><button class="danger" onclick="deleteApp(\''+a.id+'\')">Supprimer</button></div></td></tr>').join(''))+'</div>'}

function statsView(){const paid=orders.filter(o=>o.payment_status==='paid');const rev=paid.reduce((a,o)=>a+Number(o.total),0);const byMonth={};paid.forEach(o=>{const k=(o.created_at||'').slice(0,7);byMonth[k]=(byMonth[k]||0)+Number(o.total)});return '<div class="card"><h2>Statistiques des ventes</h2><div class="grid"><div><span class="muted">CA encaissé</span><h2>'+money(rev)+'</h2></div><div><span class="muted">Panier moyen payé</span><h2>'+money(paid.length?rev/paid.length:0)+'</h2></div><div><span class="muted">Commandes payées</span><h2>'+paid.length+'</h2></div><div><span class="muted">Abonnements suivis</span><h2>'+subs.length+'</h2></div></div>'+table(['Mois','CA encaissé'],Object.entries(byMonth).sort((a,b)=>b[0].localeCompare(a[0])).map(([m,v])=>'<tr><td>'+esc(m)+'</td><td>'+money(v)+'</td></tr>').join(''))+'</div>'}
function render(){metrics();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=({orders:orderView,customers:customerView,products:productView,apps:appsView,subs:subsView,stats:statsView})[tab]()}
async function loadAndRender(){try{await load();render()}catch(e){alert(e.message)}}
async function updateOrder(id,k,v){const {error}=await db.from('orders').update({[k]:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAndRender()}
async function addApp(){const name=$('#an').value.trim(),emoji=$('#ae').value.trim()||'📺',prices={};for(const n of [1,3,6,12]){const v=$('#ap'+n).value;if(v!==''&&Number(v)>0)prices[n]=Number(v)}if(!name||!Object.keys(prices).length)return alert('Indiquez un nom et au moins un prix valide.');const {error}=await db.from('apps').insert({name,emoji,prices});if(error)alert('Ajout impossible : '+error.message);else await loadAndRender()}
async function editApp(id){const a=apps.find(x=>x.id===id);if(!a)return;const name=prompt('Nom de l’application :',a.name);if(name===null)return;if(!name.trim())return alert('Nom obligatoire.');const emoji=prompt('Icône (emoji) :',a.emoji||'📺');if(emoji===null)return;const prices={};for(const n of [1,3,6,12]){const v=prompt('Prix pour '+n+' mois (laisser vide si indisponible) :',a.prices?.[n]??'');if(v===null)return;if(v.trim()!==''&&(!Number.isFinite(Number(v))||Number(v)<=0))return alert('Prix invalide.');if(v.trim()!=='')prices[n]=Number(v)}if(!Object.keys(prices).length)return alert('Au moins un prix est obligatoire.');const {error}=await db.from('apps').update({name:name.trim(),emoji:emoji.trim()||'📺',prices,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert('Modification impossible : '+error.message);else await loadAndRender()}
async function toggleApp(id,active){const {error}=await db.from('apps').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAndRender()}
async function deleteApp(id){const a=apps.find(x=>x.id===id);if(!a||!confirm('Supprimer définitivement « '+a.name+' » ?'))return;const {error}=await db.from('apps').delete().eq('id',id);if(error)alert('Suppression impossible : '+error.message);else await loadAndRender()}
async function addProduct(){const name=$('#pn').value.trim(),price=Number($('#pp').value),currency=$('#pc').value.trim()||'DA';if(!name||!$('#pp').value||price<0)return alert('Indiquez un nom et un prix valide.');const {error}=await db.from('products').insert({name,price,currency,description:$('#pd').value.trim()});if(error)alert('Ajout impossible : '+error.message);else await loadAndRender()}
async function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const name=prompt('Nom du produit :',p.name);if(name===null)return;if(!name.trim())return alert('Le nom est obligatoire.');const price=prompt('Prix :',p.price);if(price===null)return;if(price.trim()===''||!Number.isFinite(Number(price))||Number(price)<0)return alert('Prix invalide.');const currency=prompt('Devise :',p.currency||'DA');if(currency===null)return;const description=prompt('Description :',p.description||'');if(description===null)return;const {error}=await db.from('products').update({name:name.trim(),price:Number(price),currency:currency.trim()||'DA',description:description.trim(),updated_at:new Date().toISOString()}).eq('id',id);if(error)alert('Modification impossible : '+error.message);else await loadAndRender()}
async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm('Supprimer définitivement le produit « '+p.name+' » ?'))return;const {error}=await db.from('products').delete().eq('id',id);if(error)alert('Suppression impossible : '+error.message);else await loadAndRender()}
async function toggleProduct(id,active){const {error}=await db.from('products').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAndRender()}
async function toggleProduct(id,active){const {error}=await db.from('products').update({active,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAndRender()}
async function updateSub(id,status){const {error}=await db.from('subscriptions').update({status}).eq('id',id);if(error)alert(error.message);else await loadAndRender()}
async function addSub(){const service_name=$('#sn').value.trim();if(!service_name)return alert('Indiquez le nom du service.');const {error}=await db.from('subscriptions').insert({customer_id:$('#sc').value||null,service_name,start_date:$('#ss').value||null,expiry_date:$('#se').value||null});if(error)alert('Ajout impossible : '+error.message);else await loadAndRender()}
async function editSub(id){const s=subs.find(x=>x.id===id);if(!s)return;const service_name=prompt('Service / abonnement :',s.service_name);if(service_name===null)return;if(!service_name.trim())return alert('Le nom du service est obligatoire.');const start_date=prompt('Date de début (AAAA-MM-JJ) :',s.start_date||'');if(start_date===null)return;const expiry_date=prompt('Date d’expiration (AAAA-MM-JJ) :',s.expiry_date||'');if(expiry_date===null)return;const customer_id=prompt('Identifiant client (laisser vide pour aucun changement) :',s.customer_id||'');if(customer_id===null)return;const {error}=await db.from('subscriptions').update({service_name:service_name.trim(),start_date:start_date||null,expiry_date:expiry_date||null,customer_id:customer_id||null}).eq('id',id);if(error)alert('Modification impossible : '+error.message);else await loadAndRender()}
async function deleteSub(id){const s=subs.find(x=>x.id===id);if(!s||!confirm('Supprimer le suivi « '+s.service_name+' » ?'))return;const {error}=await db.from('subscriptions').delete().eq('id',id);if(error)alert('Suppression impossible : '+error.message);else await loadAndRender()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
$('#loginBtn').addEventListener('click',async()=>{
  const btn=$('#loginBtn'),email=$('#email').value.trim(),password=$('#password').value;
  if(!db){msg('Connexion au serveur non initialisée. Rechargez la page.');return}
  if(!email||!password){msg('Saisissez votre adresse e-mail et votre mot de passe.');return}
  btn.disabled=true;btn.textContent='Connexion…';msg('Vérification de vos identifiants…');
  try{
    const {error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    msg('Connexion réussie. Ouverture de votre espace administrateur…');
  }catch(e){msg('Échec de connexion : '+(e.message||'Erreur inconnue'))}
  finally{btn.disabled=false;btn.textContent='Se connecter'}
});
$('#logout').onclick=()=>db.auth.signOut();
init().catch(e=>msg('Initialisation impossible : '+(e.message||String(e))));
</script></body></html>
